<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Schmoople</title>
<style>
  :root {
    --bg: #efefef;
    --green: #4caf50;
    --tile: #ffffff;
    --border: #8a8a8a;
    --key: #b0b0b0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: "Segoe UI", Arial, sans-serif; color: #111; }
  body { display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; }
  header { width: 100%; text-align: center; border-bottom: 1px solid #c8c8c8; padding: 14px 0 12px; }
  h1 { margin: 0; font-family: "Arial Black", Arial, sans-serif; font-weight: 900; font-size: 34px; letter-spacing: 1px; }
  #goalbar { margin-top: 12px; font-size: 16px; font-weight: 600; text-align: center; }
  #goalbar b { font-size: 20px; letter-spacing: 2px; }
  #toast { min-height: 28px; margin-top: 6px; font-weight: 600; font-size: 16px; text-align: center; padding: 0 10px; }
  #boardwrap { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 360px; display: flex; flex-direction: column; margin: 6px 0 10px; }
  #board { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 4px 60px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex-shrink: 0; }
  .tile {
    width: 58px; height: 58px; background: var(--tile); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; text-transform: uppercase;
  }
  .tile.filled { border-color: #444; }
  .tile.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .row.locked .tile { border-style: dashed; }
  .row.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
  #actions { display: flex; gap: 8px; margin-top: 10px; }
  .act {
    padding: 9px 16px; font-size: 15px; font-weight: 700; border: none; border-radius: 4px;
    background: #555; color: #fff; cursor: pointer;
  }
  .act:disabled { opacity: .35; cursor: default; }
  #solve { background: #e53935; }
  #kb { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 500px; padding: 0 6px; }
  .krow { display: flex; justify-content: center; gap: 5px; }
  .key {
    flex: 1; max-width: 44px; height: 50px; border: none; border-radius: 3px;
    background: var(--key); color: #111; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .key.wide { max-width: 68px; font-size: 12px; }
  .key.enter { background: var(--green); color: #fff; }
  #again { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.3); padding: 10px 22px; font-size: 16px; font-weight: 700; border: none; border-radius: 4px; background: var(--green); color: #fff; cursor: pointer; display: none; }
  footer { margin-top: auto; padding: 14px; font-size: 13px; color: #777; text-align: center; }
</style>
</head>
<body>
<header><h1>Schmoople 🐱</h1></header>
<div id="goalbar"></div>
<div id="actions">
  <button class="act" id="undo">Undo</button>
  <button class="act" id="restart">Restart</button>
  <button class="act" id="solve">Solve</button>
</div>
<div id="toast"></div>
<div id="boardwrap">
  <div id="board"></div>
  <button id="again">Play Again</button>
</div>
<div id="kb"></div>
<footer>Change exactly one letter each guess to get from the start word to the goal word · green = matches the goal in that spot</footer>

const COMMON_SET = new Set(COMMON);

const NEIGHBORS = {};
(function buildGraph() {
  const buckets = {};
  WORDS.forEach(w => {
    NEIGHBORS[w] = [];
    for (let i = 0; i < 4; i++) {
      const key = w.slice(0, i) + '_' + w.slice(i + 1) + i;
      (buckets[key] = buckets[key] || []).push(w);
    }
  });
  Object.values(buckets).forEach(list => {
    list.forEach(a => list.forEach(b => { if (a !== b) NEIGHBORS[a].push(b); }));
  });
})();

function bfs(start) {
  const dist = { [start]: 0 };
  const parent = {};
  const queue = [start];
  while (queue.length) {
    const w = queue.shift();
    for (const n of NEIGHBORS[w]) {
      if (!(n in dist)) { dist[n] = dist[w] + 1; parent[n] = w; queue.push(n); }
    }
  }
  return { dist, parent };
}

function shortestPath(from, to) {
  const { dist, parent } = bfs(from);
  if (!(to in dist)) return null;
  const path = [];
  let w = to;
  while (w !== from) { path.unshift(w); w = parent[w]; }
  return path;
}

function pickPair() {
  for (let tries = 0; tries < 500; tries++) {
    const start = COMMON[Math.floor(Math.random() * COMMON.length)];
    const { dist } = bfs(start);
    const goals = Object.keys(dist).filter(w => COMMON_SET.has(w) && dist[w] >= 3 && dist[w] <= 7);
    if (goals.length) {
      const goal = goals[Math.floor(Math.random() * goals.length)];
      return { start, goal, min: dist[goal] };
    }
  }
  return { start: 'belt', goal: 'poop', min: 5 };
}

const boardEl = document.getElementById('board');
const kbEl = document.getElementById('kb');
const toastEl = document.getElementById('toast');
const goalEl = document.getElementById('goalbar');
const againBtn = document.getElementById('again');
const undoBtn = document.getElementById('undo');
const restartBtn = document.getElementById('restart');
const solveBtn = document.getElementById('solve');

let start, goal, minSteps, history, current, over;

function prevWord() { return history.length ? history[history.length - 1] : start; }

function makeRow(word, locked) {
  const rowEl = document.createElement('div');
  rowEl.className = 'row' + (locked ? ' locked' : '');
  for (let i = 0; i < 4; i++) {
    const t = document.createElement('div');
    t.className = 'tile';
    if (word) {
      t.textContent = word[i];
      t.classList.add('filled');
      if (word[i] === goal[i]) t.classList.add('correct');
    }
    rowEl.appendChild(t);
  }
  return rowEl;
}

function render() {
  boardEl.innerHTML = '';
  boardEl.appendChild(makeRow(start, true));
  history.forEach(w => boardEl.appendChild(makeRow(w, false)));
  if (!over) boardEl.appendChild(makeRow('', false));
  undoBtn.disabled = over || history.length === 0;
  solveBtn.disabled = over;
  restartBtn.disabled = false;
  boardEl.scrollTop = boardEl.scrollHeight;
}

function resetBoard() {
  history = []; current = ''; over = false;
  toast('');
  againBtn.style.display = 'none';
  render();
}

function newGame() {
  const p = pickPair();
  start = p.start; goal = p.goal; minSteps = p.min;
  goalEl.innerHTML = 'Start: <b>' + start.toUpperCase() + '</b> &nbsp;→&nbsp; Goal: <b>' + goal.toUpperCase() + '</b>';
  resetBoard();
  window.scrollTo(0, 0);
}

function toast(msg, ms) {
  toastEl.textContent = msg;
  if (ms) setTimeout(() => { if (toastEl.textContent === msg) toastEl.textContent = ''; }, ms);
}

function activeRow() { return boardEl.lastElementChild; }

function shake() {
  const el = activeRow();
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

function diffCount(a, b) {
  let n = 0;
  for (let i = 0; i < 4; i++) if (a[i] !== b[i]) n++;
  return n;
}

function press(k) {
  if (over) return;
  if (k === 'Enter') return submit();
  const tiles = activeRow().children;
  if (k === 'Backspace') {
    if (current.length > 0) {
      current = current.slice(0, -1);
      tiles[current.length].textContent = '';
      tiles[current.length].classList.remove('filled');
    }
    return;
  }
  if (/^[a-z]$/i.test(k) && current.length < 4) {
    tiles[current.length].textContent = k;
    tiles[current.length].classList.add('filled');
    current += k.toLowerCase();
  }
}

function submit() {
  const prev = prevWord();
  if (current.length < 4) { shake(); return toast('Not enough letters', 1200); }
  if (!WORD_SET.has(current)) { shake(); return toast('Not in word list', 1200); }
  if (current === prev) { shake(); return toast('Change one letter', 1200); }
  if (diffCount(current, prev) !== 1) { shake(); return toast('Change exactly one letter', 1500); }

  history.push(current);
  current = '';
  toast('');

  if (history[history.length - 1] === goal) {
    over = true;
    const n = history.length;
    toast('🐱 Goal reached in ' + n + ' guess' + (n === 1 ? '' : 'es') + ' · Minimum: ' + minSteps);
    againBtn.style.display = 'block';
    render();
  } else {
    render();
  }
}

function undo() {
  if (over || history.length === 0) return;
  history.pop();
  current = '';
  toast('');
  render();
}

function solve() {
  if (over) return;
  const path = shortestPath(prevWord(), goal);
  if (!path) return toast('No path from here', 1500);
  history.push(...path);
  current = '';
  over = true;
  toast('🐱 Solved for you');
  againBtn.style.display = 'block';
  render();
}

function buildKeyboard() {
  const layout = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'];
  layout.forEach(line => {
    const r = document.createElement('div');
    r.className = 'krow';
    [...line].forEach(ch => {
      const b = document.createElement('button');
      b.className = 'key';
      if (ch === '+') { b.textContent = 'Enter'; b.classList.add('wide', 'enter'); b.onclick = () => press('Enter'); }
      else if (ch === '-') { b.textContent = '⌫'; b.classList.add('wide'); b.onclick = () => press('Backspace'); }
      else { b.textContent = ch.toUpperCase(); b.onclick = () => press(ch); }
      r.appendChild(b);
    });
    kbEl.appendChild(r);
  });
}

document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && over) { e.preventDefault(); return newGame(); }
  if (e.key === 'Enter' || e.key === 'Backspace' || /^[a-z]$/i.test(e.key)) {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
    press(e.key);
  }
});
againBtn.onclick = () => { againBtn.blur(); newGame(); };
undoBtn.onclick = () => { undoBtn.blur(); undo(); };
restartBtn.onclick = () => { restartBtn.blur(); resetBoard(); };
solveBtn.onclick = () => { solveBtn.blur(); solve(); };

buildKeyboard();
newGame();
</script>
